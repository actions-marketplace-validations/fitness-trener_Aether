[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-lang"
version = "0.4.0"
description = "Security checker for AI-written Python: SQL, command and code injection, deserialization, SSTI, XXE, hardcoded credentials. Emits SARIF."
readme = "README.md"
requires-python = ">=3.10"
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [
    { name = "Aether contributors" },
]
keywords = [
    "security", "sast", "static analysis", "taint analysis", "sarif",
    "code scanning", "appsec", "vulnerability scanner", "python",
    "AI generated code", "AI agents", "programming language", "effects",
    "capabilities", "refinement types",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Quality Assurance",
]

# Aether's core depends on the Python stdlib only. The optional LLM
# fix-loop demo pulls in `anthropic`; declared as an extra so the
# default install stays minimal.
dependencies = []

[project.optional-dependencies]
llm = ["anthropic >= 0.34.0"]
smt = ["z3-solver >= 4.12"]
dev = ["pytest >= 7.0", "z3-solver >= 4.12"]

[project.urls]
Homepage   = "https://github.com/fitness-trener/Aether"
Repository = "https://github.com/fitness-trener/Aether"
Issues     = "https://github.com/fitness-trener/Aether/issues"

[project.scripts]
aether = "aether.cli:main"

# The wheel ships `aether` as the TOP-LEVEL package, which is the spelling
# README, the sdk docstring and every file in this repo already use. It used
# to ship `transpiler`, so an installed user's only working import was
# `from transpiler.aether import sdk` while every document said otherwise
# (BUGS.md BUG-009) — and `transpiler` is far too generic a name to occupy
# in someone's site-packages, the same objection that kept `tools` out in
# BUG-007.
#
# `transpiler/__init__.py` stays in the CHECKOUT: `python -m
# transpiler.aether.cli` is how ~20 call sites across tests, bench, demos
# and the playground invoke the CLI without installing. It is simply not
# part of the distribution.
[tool.setuptools]
package-dir = {"" = "transpiler"}

# `where` scopes discovery to the one directory that holds library code, so
# tests/, demos/, bench/ and the rest cannot be shipped by accident. That is
# a structural guarantee; the long `exclude` list this replaces was a
# promise to remember every new top-level directory.
[tool.setuptools.packages.find]
where = ["transpiler"]
include = ["aether*"]
exclude = ["*__pycache__*"]

[tool.setuptools.package-data]
"aether" = ["py.typed"]
