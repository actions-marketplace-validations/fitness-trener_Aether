name: 'Aether Python Security Scan'
# Marketplace caps this at 125 characters.
description: 'Security scan for Python, aimed at AI-agent code: injection, deserialization, SSTI, untrusted XML, credentials. SARIF output.'
author: 'Aether'

branding:
  icon: 'shield'
  color: 'purple'

# ---------------------------------------------------------------------------
# The caller's workflow must grant:
#
#   permissions:
#     contents: read
#     security-events: write   # only if upload-sarif is true (the default)
#
# A composite action cannot grant its own permissions, and without
# `security-events: write` the upload step fails with 403.
# ---------------------------------------------------------------------------

inputs:
  path:
    description: >-
      Files and/or directories to scan, space-separated. Directories are
      walked recursively for .py, skipping .git, .venv, node_modules,
      __pycache__, build, dist and site-packages.
    required: false
    default: '.'
  strict:
    description: >-
      Also report E0711 (dynamic filesystem paths) and the E0701 capability
      inventory. Both are held back by default by measurement, not taste:
      on 1.19M lines of PyPI code (2026-07-26), E0711 alone fired 476 times
      against 170 for the whole default set, both over every file
      (bench/pypi_scan/REPORT.md).
    required: false
    default: 'false'
  fail-on-findings:
    description: >-
      Fail the job when the scan reports a finding. An analyzer crash
      (`check-py` exit 3) always fails the job regardless — that is a bug in
      Aether, not a property of your code, and it must not pass silently.
    required: false
    default: 'true'
  allow-incomplete:
    description: >-
      Pass the job even when some .py files could not be parsed (py2
      sources, templates, or 3.12+ syntax on an older python-version) and
      were therefore not scanned. Off by default: a file that was not
      parsed was not checked, so an incomplete scan fails the job.
    required: false
    default: 'false'
  upload-sarif:
    description: 'Upload the SARIF report to GitHub Code Scanning.'
    required: false
    default: 'true'
  sarif-file:
    description: 'Where to write the SARIF report.'
    required: false
    default: 'aether.sarif'
  category:
    description: >-
      Code Scanning category. Give each Aether run in a workflow its own
      category, or the later upload replaces the earlier one's alerts.
    required: false
    default: 'aether'
  setup-python:
    description: >-
      Install Python with actions/setup-python. Set to "false" if the job
      already set up the interpreter you want Aether to run under.
    required: false
    default: 'true'
  python-version:
    description: 'Python version, when setup-python is true. Aether needs 3.10+.'
    required: false
    default: '3.12'

outputs:
  findings:
    description: 'Number of findings in the SARIF report.'
    value: ${{ steps.scan.outputs.findings }}
  sarif-file:
    description: 'Path to the SARIF report that was written.'
    value: ${{ steps.scan.outputs.sarif-file }}
  exit-code:
    description: >-
      Raw `aether check-py` exit code: 0 clean, 1 findings, 2 usage error,
      3 analyzer crash, 4 incomplete (some file not parsed, no findings).
    value: ${{ steps.scan.outputs.exit-code }}
  unparsed:
    description: 'Number of files that could not be parsed and were not scanned.'
    value: ${{ steps.scan.outputs.unparsed }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      if: inputs.setup-python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Aether
      shell: bash
      run: |
        # From the action's own checkout, so the version is pinned by the
        # `uses:` ref rather than by whatever is on PyPI today. Aether's
        # core is stdlib-only, so this resolves nothing over the network.
        python -m pip install --disable-pip-version-check --quiet "$GITHUB_ACTION_PATH"

    - name: Run Aether
      id: scan
      shell: bash
      # Inputs reach the shell as environment variables, never as template
      # interpolation: `${{ inputs.path }}` spliced into a run: block is a
      # script-injection sink, and shipping that in a security scanner would
      # be its own headline.
      env:
        AETHER_PATH: ${{ inputs.path }}
        AETHER_STRICT: ${{ inputs.strict }}
        AETHER_SARIF: ${{ inputs.sarif-file }}
        AETHER_ALLOW_INCOMPLETE: ${{ inputs.allow-incomplete }}
      run: |
        set -uo pipefail
        # `${a[@]:+"${a[@]}"}` is the expansion that is safe for an EMPTY
        # array under `set -u`; a bare "${a[@]}" is an unbound-variable
        # error on older bash.
        flags=()
        if [ "$AETHER_STRICT" = "true" ]; then flags+=(--strict); fi

        # Word-split AETHER_PATH on whitespace so several targets work, and
        # reject anything that is not an existing path before it reaches the
        # command line.
        read -r -a targets <<< "$AETHER_PATH"
        if [ "${#targets[@]}" -eq 0 ]; then
          echo "::error::aether: the 'path' input is empty"
          exit 1
        fi
        for t in "${targets[@]}"; do
          if [ ! -e "$t" ]; then
            echo "::error::aether: no such file or directory: $t"
            exit 1
          fi
        done

        # ONE run. Its stderr (unparseable files, analyzer errors) goes to
        # the log as it happens; the report below is read back from the
        # SARIF, so the log and Code Scanning cannot disagree.
        aether check-py "${targets[@]}" ${flags[@]:+"${flags[@]}"} --sarif > "$AETHER_SARIF"
        rc=$?
        {
          echo "sarif-file=$AETHER_SARIF"
          echo "exit-code=$rc"
        } >> "$GITHUB_OUTPUT"

        # The exit-code table (docs/SCANNING.md): 0 clean, 1 findings,
        # 2 usage, 3 analyzer crash, 4 incomplete.
        if [ "$rc" -eq 3 ]; then
          echo "::error::Aether's analyzer crashed (exit 3). That is a bug in Aether, not in your code. Please report it:"
          echo "https://github.com/fitness-trener/Aether/issues"
          exit 1
        fi
        if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ] && [ "$rc" -ne 4 ]; then
          echo "::error::aether check-py exited $rc (usage error); see the message above."
          exit 1
        fi

        report=$(python - "$AETHER_SARIF" <<'PY'
        import json, sys
        run = json.load(open(sys.argv[1], encoding="utf-8"))["runs"][0]
        for r in run["results"]:
            loc = r["locations"][0]["physicalLocation"]
            print(f'{loc["artifactLocation"]["uri"]}:{loc["region"]["startLine"]}: '
                  f'{r["ruleId"]} {r["message"]["text"]}', file=sys.stderr)
        notes = run["invocations"][0]["toolExecutionNotifications"]
        print(len(run["results"]), sum(1 for n in notes if n["level"] == "warning"))
        PY
        ) || { echo "::error::aether: could not read the SARIF report"; exit 1; }
        read -r findings unparsed <<< "$report"
        {
          echo "findings=$findings"
          echo "unparsed=$unparsed"
        } >> "$GITHUB_OUTPUT"
        echo "aether: $findings finding(s), $unparsed file(s) not parsed"

        # Incomplete — whether or not there were findings (exit 1 hides
        # it): a file that was not parsed was not checked.
        if [ "$unparsed" -gt 0 ] && [ "$AETHER_ALLOW_INCOMPLETE" != "true" ]; then
          echo "::error::Aether could not parse $unparsed file(s), so they were not scanned (listed above). Set allow-incomplete: true to accept that."
          exit 1
        fi

    - name: Upload SARIF to Code Scanning
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: ${{ inputs.category }}

    - name: Fail on findings
      if: ${{ inputs.fail-on-findings == 'true' && steps.scan.outputs.findings != '0' }}
      shell: bash
      run: |
        echo "::error::Aether reported ${{ steps.scan.outputs.findings }} finding(s)."
        echo "Each is listed above with its code, file and line, and in the"
        echo "Security -> Code Scanning tab ranked by security-severity."
        exit 1
